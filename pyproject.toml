[project]
name = "agent-smith"
version = "0.1.0"
description = "Autonomous reasoning, code generation, and execution agentic framework"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "mcp>=2.3.0",
    "pydantic>=2.13.5",
]

[project.scripts]
sandbox = "agent_smith.sandbox.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "flake8>=7.0.0",
    "mypy>=1.10.0",
]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
disallow_untyped_decorators = false